<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รหัสยืนยันตัวตน DealMee</title>
</head>
<body style="margin:0;padding:0;background:#F1F5F9;font-family:Tahoma,'Segoe UI',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F1F5F9;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:20px;overflow:hidden;">
          <tr>
            <td style="height:6px;background:#2563EB;"></td>
          </tr>
          <tr>
            <td align="center" style="padding:28px 32px 8px;">
              <img src="{{ .SiteURL }}/logos/dealmee-logo-horizontal.png" alt="DealMee" width="160" style="display:block;border:0;width:160px;height:auto;">
            </td>
          </tr>
          <tr>
            <td style="padding:8px 32px 8px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td style="font-size:22px;font-weight:bold;color:#0F172A;padding:12px 0;text-align:center;">รหัสยืนยันตัวตน</td>
              </tr>
              <tr>
                <td style="font-size:15px;line-height:24px;color:#334155;padding-bottom:20px;">ใช้รหัสนี้เพื่อยืนยันตัวตนก่อนทำรายการสำคัญ:<br><br><span style="display:block;text-align:center;font-size:32px;font-weight:bold;letter-spacing:8px;color:#2563EB;">{{ .Token }}</span></td>
              </tr>
              <tr>
                <td style="font-size:13px;line-height:20px;color:#64748B;border-top:1px solid #E2E8F0;padding:16px 0 24px;">อย่าบอกรหัสนี้กับใคร ทีมงาน DealMee จะไม่ขอรหัสนี้จากคุณ ถ้าคุณไม่ได้ทำรายการนี้ ไม่ต้องทำอะไร บัญชีของคุณยังปลอดภัย</td>
              </tr>
              </table>
            </td>
          </tr>
        </table>
        <p style="font-size:12px;color:#94A3B8;margin:16px 0 0;">DealMee · ผู้ช่วยขายอัตโนมัติสำหรับร้านค้าออนไลน์</p>
      </td>
    </tr>
  </table>
</body>
</html>
