name: Follow-up scheduler

# Delivers queued bot follow-ups (QR payment reminders, booking reminders,
# scheduled messages) by calling the app's cron endpoint every 5 minutes.
# Needs repository secrets APP_URL (e.g. https://app.dealmee.app) and CRON_SECRET
# (same value as the CRON_SECRET env var on Vercel).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-follow-ups:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call follow-up endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          # A redirect means APP_URL isn't the exact production origin (e.g. http:// or the
          # bare domain); curl would otherwise report success without anything running.
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST "${APP_URL%/}/api/cron/follow-up" \
            -H "Authorization: Bearer $CRON_SECRET")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Follow-up endpoint returned HTTP $status. Check that APP_URL is exactly https://app.dealmee.app and CRON_SECRET matches Vercel."
            exit 1
          fi
