name: Follow-up scheduler

# MANUAL ONLY. The schedule now lives in the database (pg_cron + pg_net, migration
# 20261030000000_pg_cron_follow_up.sql) — see docs/guides/scheduler-pg-cron.md.
# This repo is private, so every 5 minutes cost ~8,640 Actions minutes a month against a
# 2,000-minute free quota; the quota ran out and GitHub stopped starting the job, which
# silently stopped payment reminders, order expiry and wallet renewals (24 Oct 2026).
#
# Kept as a manual fallback: run it from the Actions tab if the database scheduler is
# ever down. Needs repository secrets APP_URL (e.g. https://app.dealmee.app) and
# CRON_SECRET (same value as the CRON_SECRET env var on Vercel).

on:
  workflow_dispatch:

jobs:
  run-follow-ups:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call follow-up endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          # A redirect means APP_URL isn't the exact production origin (e.g. http:// or the
          # bare domain); curl would otherwise report success without anything running.
          status=$(curl -sS -o response.json -w "%{http_code}" -X POST "${APP_URL%/}/api/cron/follow-up" \
            -H "Authorization: Bearer $CRON_SECRET")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Follow-up endpoint returned HTTP $status. Check that APP_URL is exactly https://app.dealmee.app and CRON_SECRET matches Vercel."
            exit 1
          fi
