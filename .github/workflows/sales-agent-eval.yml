name: Sales agent eval

# Layer 1 runs on every pull request and push to main: scripted tool routing,
# grounding, handoff, and the COD gate. No model key.
# Layer 2 calls the real model. It runs only from the Actions tab, and only
# when GEMINI_API_KEY or OPENROUTER_API_KEY is configured as a repository secret.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      provider:
        description: gemini or openrouter
        default: gemini
        type: string
      model:
        description: Model id. Leave blank for the provider default.
        default: ''
        type: string
      judge:
        description: Set to 1 to also score with an LLM judge.
        default: '0'
        type: string

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  live:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run live eval when a model key is configured
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EVAL_PROVIDER: ${{ github.event.inputs.provider }}
          EVAL_MODEL: ${{ github.event.inputs.model }}
          EVAL_JUDGE: ${{ github.event.inputs.judge }}
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "GEMINI_API_KEY and OPENROUTER_API_KEY are unset; skipping the live eval."
            exit 0
          fi
          if [ "$EVAL_PROVIDER" = "openrouter" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "EVAL_PROVIDER=openrouter but OPENROUTER_API_KEY is unset; skipping."
            exit 0
          fi
          if [ "$EVAL_PROVIDER" != "openrouter" ] && [ -z "$GEMINI_API_KEY" ]; then
            echo "Gemini live eval requested but GEMINI_API_KEY is unset; skipping."
            exit 0
          fi
          npm run eval:live
